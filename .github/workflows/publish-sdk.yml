name: Publish plugin SDK

# Packs the plugin SDK (backend/src/Innovayse.SDK, MIT licensed) and pushes it to a NuGet feed, so
# plugin authors pin a package version instead of referencing this repository.
#
# Runs once the CI workflow has finished green for a push to main, on exactly the commit CI tested.
# A pull request run of CI never publishes, even from a fork branch that happens to be named main.
#
# Idempotent per version: `dotnet nuget push --skip-duplicate` turns a version the feed already has
# into a no-op, so a merge that does not raise <Version> in Innovayse.SDK.csproj publishes nothing
# and fails nothing. backend:publish:sdk in .gitlab-ci.yml does the same on the GitLab side; with
# both configured the second push of a version is skipped, so either or both may be set up.
#
# Variable: SDK_NUGET_SOURCE (the feed's push URL, e.g. https://api.nuget.org/v3/index.json).
# Secret: SDK_NUGET_API_KEY. Without both the run says so and ends green: an unconfigured feed is
# not a failed workflow.
#
# Third-party actions are pinned to a commit SHA with the version in a comment; Dependabot keeps
# them up to date.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One publish at a time; a later one waits rather than cancelling a push in flight.
concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin SDK package
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SDK_NUGET_SOURCE: ${{ vars.SDK_NUGET_SOURCE }}
      SDK_NUGET_API_KEY: ${{ secrets.SDK_NUGET_API_KEY }}
    steps:
      - name: Check the feed is configured
        id: feed
        working-directory: .
        run: |
          if [ -z "$SDK_NUGET_SOURCE" ] || [ -z "$SDK_NUGET_API_KEY" ]; then
            echo "::notice::SDK package not published: set the repository variable SDK_NUGET_SOURCE and the secret SDK_NUGET_API_KEY to publish it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.feed.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - if: steps.feed.outputs.configured == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "9.0.x"
      - name: Pack
        if: steps.feed.outputs.configured == 'true'
        run: dotnet pack src/Innovayse.SDK/Innovayse.SDK.csproj -c Release -o ../sdk-package -p:InnovayseSso=false -p:ContinuousIntegrationBuild=true
      - name: Push (a version the feed already has is skipped)
        if: steps.feed.outputs.configured == 'true'
        run: dotnet nuget push "../sdk-package/*.nupkg" --source "$SDK_NUGET_SOURCE" --api-key "$SDK_NUGET_API_KEY" --skip-duplicate
