name: CI

# Checks pull requests from contributors, who build the standalone flavour.
#
# The full pipeline (images, deploys) runs on GitLab, and GitLab always has the private
# registry credential, so it only ever compiles the SSO build. This workflow covers the
# other one: the build every outside contributor gets from a plain clone, with
# Innovayse.Auth left out (-p:InnovayseSso=false, see backend/Directory.Build.props).
# It needs no secrets, which is also what makes it safe to run on pull requests from forks.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Toolchain versions, named once for every job below.
env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "22"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (standalone build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Innovayse.Hostpanel.sln -p:InnovayseSso=false
      - name: Build
        run: dotnet build Innovayse.Hostpanel.sln -c Release --no-restore -p:InnovayseSso=false
      - name: Unit tests
        run: |
          for suite in Hostpanel.Domain Hostpanel.Architecture CWP Inecobank; do
            dotnet test "tests/Innovayse.$suite.Tests" -c Release --no-build
          done

  # The Integration suite starts a PostgreSQL container and a full API host for every test class
  # (about 430 of them), so one testhost running all of it outlives any sensible job limit and
  # holds memory the whole time. It is split by top-level test folder into four shards that run
  # in parallel, mirroring backend:test:integration:a-d in .gitlab-ci.yml (which runs them one at a time). Every
  # folder under Integration.Tests belongs to exactly one shard; a new folder must be added to
  # one of them or its tests run nowhere. (Fixtures/ holds fakes only, no tests.)
  integration:
    name: Backend integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1 of 4
            filter: >-
              FullyQualifiedName~Integration.Tests.Adapters.|FullyQualifiedName~Integration.Tests.Admin.|FullyQualifiedName~Integration.Tests.Audit.|FullyQualifiedName~Integration.Tests.Auth.|FullyQualifiedName~Integration.Tests.Clients.|FullyQualifiedName~Integration.Tests.Common.|FullyQualifiedName~Integration.Tests.Demo.|FullyQualifiedName~Integration.Tests.Health.|FullyQualifiedName~Integration.Tests.Identity.|FullyQualifiedName~Integration.Tests.Security.|FullyQualifiedName~Integration.Tests.Shared.
          - shard: 2 of 4
            filter: >-
              FullyQualifiedName~Integration.Tests.Billing.|FullyQualifiedName~Integration.Tests.Domains.
          - shard: 3 of 4
            filter: >-
              FullyQualifiedName~Integration.Tests.Reports.|FullyQualifiedName~Integration.Tests.Slides.|FullyQualifiedName~Integration.Tests.Support.|FullyQualifiedName~Integration.Tests.Faqs.|FullyQualifiedName~Integration.Tests.Partners.|FullyQualifiedName~Integration.Tests.Projects.|FullyQualifiedName~Integration.Tests.Testimonials.
          - shard: 4 of 4
            filter: >-
              FullyQualifiedName~Integration.Tests.Migration.|FullyQualifiedName~Integration.Tests.Notifications.|FullyQualifiedName~Integration.Tests.Orders.|FullyQualifiedName~Integration.Tests.Persistence.|FullyQualifiedName~Integration.Tests.Products.|FullyQualifiedName~Integration.Tests.Provisioning.|FullyQualifiedName~Integration.Tests.Services.
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Keeps glibc from giving every thread its own arena; the testhost runs many.
      MALLOC_ARENA_MAX: "2"
      # Ryuk stays on in CI so a killed shard cannot leave PostgreSQL containers behind.
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore tests/Innovayse.Hostpanel.Integration.Tests -p:InnovayseSso=false
      - name: Build
        run: dotnet build tests/Innovayse.Hostpanel.Integration.Tests -c Release --no-restore -p:InnovayseSso=false
      - name: Integration tests (Testcontainers, shard ${{ matrix.shard }})
        run: dotnet test tests/Innovayse.Hostpanel.Integration.Tests -c Release --no-build --blame-crash --filter "${{ matrix.filter }}"

  client:
    name: Client portal (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test

  admin:
    name: Admin panel (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      # The same lint the GitLab admin:test job runs; build alone never lints, so a lint-only
      # failure used to reach main unnoticed.
      - run: npm run lint:ci
      - run: npm run lint:i18n
      - run: npm run build
