# Weekly dependency updates, proposed as pull requests against develop.
#
# Why this exists: SixLabors.ImageSharp 2.1.13 picked up high-severity advisories and the
# first anyone heard of it was every build failing NuGet's audit (TreatWarningsAsErrors).
# Dependabot raises those as PRs instead, which CI then builds and tests.
#
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise down;
# major versions arrive one PR each, since they need reading. Security updates are not
# grouped and are not limited by the PR cap.
#
# Docker base images are not listed: the Dockerfiles use moving tags (node:22-alpine,
# dotnet/sdk:9.0) that already pick up patches on rebuild, and a major runtime bump is a
# decision, not a routine update.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    labels: [dependencies, "area: backend"]
    ignore:
      # Published to Innovayse's private registry, which Dependabot cannot reach.
      - dependency-name: Innovayse.Auth
      # The ImageSharp line was dropped for licensing reasons; see Directory.Packages.props.
      - dependency-name: SixLabors.ImageSharp
    groups:
      # SkiaSharp and its native assets must stay on the same version.
      skiasharp:
        patterns: ["SkiaSharp*"]
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    labels: [dependencies, "area: client"]
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Yerevan
    open-pull-requests-limit: 5
    labels: [dependencies, "area: admin"]
    groups:
      admin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
