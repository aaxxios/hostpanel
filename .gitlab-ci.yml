# Which pushes get a pipeline at all. Every branch-gated rule below hangs off this:
# a job's own `if:` is never evaluated unless a pipeline was created here first.
workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"      # → production (ProdServer, manual)
    # A push to develop no longer builds anything. Stage is out of use, so the images
    # this produced and the staging deploy behind them were work nobody collected, and
    # the commits in it were already tested on the merge request that gated them. The
    # line is commented rather than deleted and every develop-gated job is left defined
    # and dormant, so bringing staging back is this one line.
    # - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop" # → staging (LocalServer)
    # ci-test stays. It is not a branch anything is developed on — it exists to try a
    # change to this file on a real pipeline, which is the only way to verify one, and
    # it only builds when somebody deliberately pushes that name.
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"   # throwaway verification branch
    # A version tag (v1.2.3) gets a pipeline of its own, holding only publish:dockerhub.
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages: [test, build, deploy]

# ── Reusable templates (inlined — this project runs on a GitLab pull-mirror
#    of the GitHub repo and has no access to the workspace's shared
#    ci/templates.yml, so the relevant hidden jobs are copied here) ───────────

.test-dotnet:
  stage: test
  tags: [builder]
  image: mcr.microsoft.com/dotnet/sdk:9.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    # The credential for Innovayse.Auth, which lives in innovayse-workspace's package
    # registry. backend/nuget.config deliberately carries no credentials and expects
    # them from the environment, but nothing here ever supplied them: every restore
    # reached the feed anonymously and came back 401, so `dotnet test` failed before
    # running a single test and the build jobs behind it were skipped.
    #
    # This exact spelling is the one NuGet reads. The NUGET_PACKAGE_SOURCE_CREDENTIALS_
    # form named in nuget.config's comment is read by nothing — the same mistake the
    # workspace's compose files already had and fixed.
    #
    # It is the job's own token, valid only while the job runs. For it to be accepted
    # the workspace project must list this project in its CI_JOB_TOKEN allowlist,
    # since a job token is scoped to its own project by default.
    NuGetPackageSourceCredentials_innovayse: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
    # Testcontainers starts Ryuk, its reaper container, before the first real container and
    # then dials it on a mapped port. On the builder runner that connection is never made:
    # it waits its full minute, throws "ResourceReaperException: Initialization has been
    # cancelled", and every Integration.Tests case fails in IntegrationTestFactory.InitializeAsync
    # before a Postgres container is even requested -- twice in a row on 2026-10-05.
    #
    # Ryuk only removes containers a crashed run leaves behind. IntegrationTestFactory.DisposeAsync
    # disposes its Postgres on every normal exit, so without Ryuk a leak needs a killed job, and
    # what it leaves is one Postgres container on the builder host to remove by hand.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd "$SERVICE"
    # -m:1 keeps MSBuild to a single node, so the solution's test projects build and run one
    # after another instead of all at once. The default fans them out, and each `dotnet test`
    # host holds its own copy of the EF model -- roughly a gigabyte for the Infrastructure
    # suite alone. The staging box has 7 GB in total and also hosts every product's containers
    # and up to four concurrent CI jobs, so the parallel default exhausted it: the runner was
    # killed mid-run and GitLab reported `no_updates_running` and `runner_system_failure` --
    # never a failing assertion, and never a line of test output explaining it.
    #
    # It costs wall-clock and buys the job the ability to finish. Revisit if the host grows.
    #
    # --blame-crash because this job has failed three times in one day with every assertion
    # green: all six suites report "Passed! Failed: 0", then the run aborts with "Test host
    # process crashed" during Integration.Tests teardown -- where Testcontainers stops its
    # Postgres -- and the job exits 1 with no other output. A retry has cleared it every time,
    # which is the shape of a loaded runner rather than a defect, but "retry until green" is
    # not a diagnosis and the log gives nothing to work from.
    #
    # The flag makes the host write a sequence file naming the test in flight when it died,
    # and a dump beside it. Costs nothing on a passing run.
    #
    # The solution is no longer tested in one `dotnet test`: the Integration suite is split
    # into four jobs by test namespace (see backend:test:integration:a-d below), because one
    # host running the whole suite held the EF model plus a Postgres container for every
    # test and exhausted the runner's memory. Each job names its projects in TEST_PROJECTS
    # (folders under tests/) and, optionally, a --filter in TEST_FILTER.
    - |
      for project in $TEST_PROJECTS; do
        if [ -n "$TEST_FILTER" ]; then
          dotnet test "tests/$project" --nologo -m:1 --blame-crash --filter "$TEST_FILTER" || exit 1
        else
          dotnet test "tests/$project" --nologo -m:1 --blame-crash || exit 1
        fi
      done

.test-node-yarn:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - corepack enable && corepack prepare yarn@1.22.22 --activate
    - yarn install --frozen-lockfile
    - yarn lint
    # Blocking: locale parity, unused keys and undefined literal keys fail the pipeline.
    - yarn lint:i18n
    # Blocking: every conformance metric (raw tags, jsdoc, braces, placeholders, test ids ...) is zero.
    - yarn audit:conformance --strict
    - yarn typecheck
    - yarn test --maxWorkers=2
    - yarn build
  # The production build is what the e2e job serves (`node .output/server/index.mjs`).
  artifacts:
    expire_in: 1 day
    paths: [client/.output/]

.test-node-npm:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd "$SERVICE"
    - npm ci
    - npm run build-only

.build-image:
  stage: build
  tags: [builder]
  image: docker:27
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # The API image restores Innovayse.Auth during its build, so the credential has to
    # arrive as a build arg — see the note on .test-dotnet. Harmless for the client and
    # admin images, whose Dockerfiles never declare the ARG.
    - docker build --build-arg "NuGetPackageSourceCredentials_innovayse=Username=gitlab-ci-token;Password=$CI_JOB_TOKEN" --build-arg AUTH_MODE=sso --target "$IMAGE_TARGET" -f "$DOCKERFILE" -t "$IMAGE:$TAG" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    - docker push "$IMAGE:$TAG"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"

.deploy-staging:
  stage: deploy
  tags: [staging]
  variables:
    GIT_STRATEGY: none
    # The build below restores Innovayse.Auth from the package registry, so the
    # credential has to reach it here the same way it does on production.
    NUGET_INNOVAYSE_CREDENTIALS: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - cd "$DEPLOY_DIR"
    # GIT_STRATEGY is none, so the runner never touches this checkout — but the
    # deploy builds the api, client and admin images from it (neither compose file
    # gives those services an `image:`, so there is nothing to pull). Left alone it
    # deploys whatever was last checked out by hand; this host sat 33 commits back
    # that way. Sync it to the branch that triggered the pipeline so the tier
    # really is the branch.
    - git fetch --prune origin
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    # docker-compose.platform.yml joins the shared innovayse_network - without it
    # the containers are unreachable by name from the reverse proxy. The chain is
    # shared + prod + platform, the same set every deployed tier runs. Compose reads
    # docker/.env (the host's values) because the files sit in docker/.
    #
    # Staging has no CI-built image for the develop branch, so the three application
    # images are built here from the synced checkout and tagged hostpanel/<svc>:stage
    # (prod.yml carries both `image:` and `build:`); only the infrastructure images are pulled.
    - export IMAGE_TAG=stage
    - docker compose -f docker/docker-compose.shared.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.platform.yml pull --ignore-buildable
    - docker compose -f docker/docker-compose.shared.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.platform.yml build hostpanel-api hostpanel-client hostpanel-admin
    # Services named one by one to leave nginx out. It publishes 80 and 443, which
    # on this host belong to the shared Nginx Proxy Manager that fronts every
    # Innovayse product - so it can never bind. The platform overlay parks it too.
    - docker compose -f docker/docker-compose.shared.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.platform.yml up -d hostpanel-db hostpanel-api hostpanel-client hostpanel-admin
  # This job has no `image:`, so it is the shell executor: the login above writes
  # the runner user's real ~/.docker/config.json on the staging host, and nothing
  # took it away again. CI_JOB_TOKEN dies with the job, but the entry stayed, and
  # Docker sends it on every later pull from registry.gitlab.com - including
  # public ones. That is how three main-branch test jobs failed to pull
  # gitlab-runner-helper with "HTTP Basic: Access denied" before running a single
  # test. after_script runs even when the deploy fails, which is exactly when the
  # stale entry would otherwise be left behind.
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    # Off with the job that extends this. A rule here is overridden by any job that
    # declares its own, so this is not what stops deploy:staging -- it is what stops a
    # job added later that forgets to.
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop" && $DEPLOY_STAGING == "true"

# ── backend (Innovayse.Hostpanel.API, .NET) ──────────────────────────────────────────────

backend:test:
  extends: .test-dotnet
  variables:
    SERVICE: backend
    TEST_PROJECTS: >-
      Innovayse.Hostpanel.Domain.Tests
      Innovayse.Hostpanel.Architecture.Tests
      Innovayse.CWP.Tests
      Innovayse.Inecobank.Tests
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [backend/**/*]

# The Integration suite, in four shards that run ONE AT A TIME. Every top-level folder of
# Integration.Tests belongs to exactly one shard; a new folder must be added to one of
# them or its tests run nowhere. (Fixtures/ holds fakes only, no tests.) The split is the
# same as the four shards of .github/workflows/ci.yml.
#
# One testhost grows to several gigabytes (the EF model, a Postgres container and a full API
# host per test class) and the builder has 12 GB shared with other products' pipelines. With two
# half-suite shards running together the kernel OOM-killed the testhost every time ("Test host
# process crashed", or a 500/timeout in whichever test was in flight). A quarter of the suite
# per host, one host at a time (resource_group), plus a bounded glibc arena count, keeps each
# host far below that.
.test-integration:
  extends: .test-dotnet
  resource_group: hostpanel-integration
  variables:
    SERVICE: backend
    TEST_PROJECTS: Innovayse.Hostpanel.Integration.Tests
    # Keeps glibc from giving every thread its own arena; the testhost runs many.
    MALLOC_ARENA_MAX: "2"
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [backend/**/*]

backend:test:integration:a:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Adapters.|FullyQualifiedName~Integration.Tests.Admin.|FullyQualifiedName~Integration.Tests.Audit.|FullyQualifiedName~Integration.Tests.Auth.|FullyQualifiedName~Integration.Tests.Clients.|FullyQualifiedName~Integration.Tests.Common.|FullyQualifiedName~Integration.Tests.Demo.|FullyQualifiedName~Integration.Tests.Health.|FullyQualifiedName~Integration.Tests.Identity.|FullyQualifiedName~Integration.Tests.Security.|FullyQualifiedName~Integration.Tests.Shared.

backend:test:integration:b:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Billing.|FullyQualifiedName~Integration.Tests.Domains.

backend:test:integration:c:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Reports.|FullyQualifiedName~Integration.Tests.Slides.|FullyQualifiedName~Integration.Tests.Support.

backend:test:integration:d:
  extends: .test-integration
  variables:
    TEST_FILTER: >-
      FullyQualifiedName~Integration.Tests.Migration.|FullyQualifiedName~Integration.Tests.Notifications.|FullyQualifiedName~Integration.Tests.Orders.|FullyQualifiedName~Integration.Tests.Persistence.|FullyQualifiedName~Integration.Tests.Products.|FullyQualifiedName~Integration.Tests.Provisioning.|FullyQualifiedName~Integration.Tests.Services.

backend:build:api:prod:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: backend/Dockerfile, BUILD_CONTEXT: backend, IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [backend/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [backend/**/*]

backend:build:api:dev:
  extends: .build-image
  variables: { SERVICE: api, DOCKERFILE: backend/Dockerfile, BUILD_CONTEXT: backend, IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [backend/Dockerfile]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [backend/Dockerfile]

# ── client (Nuxt frontend, yarn) ────────────────────────────────────────────────

client:test:
  extends: .test-node-yarn
  variables: { SERVICE: client }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [client/**/*]

# Playwright against the production build of client:test, with the stub backend
# (client/e2e/support/stub-backend.mjs) standing in for the API. The image tag follows
# @playwright/test in client/package.json.
client:e2e:
  stage: test
  tags: [builder]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  needs: [client:test]
  script:
    - cd client
    - corepack enable && corepack prepare yarn@1.22.22 --activate
    - yarn install --frozen-lockfile
    - yarn e2e
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths: [client/test-results/, client/e2e-results.xml]
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [client/**/*]

client:build:prod:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: client/Dockerfile, BUILD_CONTEXT: client, IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [client/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [client/**/*]

client:build:dev:
  extends: .build-image
  variables: { SERVICE: client, DOCKERFILE: client/Dockerfile, BUILD_CONTEXT: client, IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [client/Dockerfile]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [client/Dockerfile]

# ── admin (Vue/Vite, npm) ────────────────────────────────────────────────────

# Every gate the admin has, in the order a failure is cheapest to read: lint (non-fixing),
# i18n catalogues, the real typecheck (-b --force), unit tests, then the production build.
admin:test:
  stage: test
  tags: [builder]
  image: node:22
  script:
    - cd admin
    - npm ci
    - npm run lint:ci
    - npm run lint:i18n
    - npm run typecheck
    - npm test -- --maxWorkers=2
    - npm run build-only
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [admin/**/*]

# Playwright flows against `vite preview`; the API is stubbed with page.route, so no backend runs.
# The image tag must match the @playwright/test version pinned in admin/package.json.
admin:e2e:
  stage: test
  tags: [builder]
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  needs: [admin:test]
  script:
    - cd admin
    - npm ci
    - npm run e2e
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      changes: [admin/**/*]

admin:build:prod:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: admin/Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: prod, TAG: latest }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [admin/**/*]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [admin/**/*]

admin:build:dev:
  extends: .build-image
  variables: { SERVICE: admin, DOCKERFILE: admin/Dockerfile, BUILD_CONTEXT: ., IMAGE_TARGET: dev, TAG: dev }
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
      changes: [admin/Dockerfile, docker/nginx/admin.conf]
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"
      changes: [admin/Dockerfile, docker/nginx/admin.conf]

# ── deploy ───────────────────────────────────────────────────────────────────

deploy:staging:
  extends: .deploy-staging
  variables:
    DEPLOY_DIR: /home/innovayse/www/innovayse-workspace/hostpanel
    # Which tier the API believes it is running on. docker/docker-compose.dev.yml passes
    # ${ASPNETCORE_ENVIRONMENT} through to it — the laptop .env sets Development, and
    # a deployed host inherited that too unless someone had
    # remembered to write the variable into that host's .env by hand. An API left on
    # Development serves developer exception pages, and it is also what makes an
    # absent EncryptionKey allowed rather than fatal, so server credentials and
    # client-service passwords go to the database in plain text. Setting it per tier
    # here is what makes it true of the deployment rather than of one file on one
    # machine.
    ASPNETCORE_ENVIRONMENT: Production
  environment: { name: staging/hostpanel }
  rules:
    # Staging deploys are off: that host filled its disk and this job fails in get_sources,
    # before the deploy script runs at all. Production is unaffected -- it deploys from main,
    # on another host, and is manual. Set DEPLOY_STAGING=true in CI/CD variables to turn it
    # back on; the condition below is the one this job had before, unchanged.
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "develop" && $DEPLOY_STAGING == "true"
  needs:
    - job: backend:build:api:prod
      optional: true
    - job: client:build:prod
      optional: true
    - job: admin:build:prod
      optional: true

# ── demo ─────────────────────────────────────────────────────────────────────
# A second copy of the stack in demo mode (fake payment, registrar and provisioning adapters, mail to
# its own mailhog, periodic data reset) on ProdServer, beside production. The chain is
# shared + prod + platform + demo and the project is pinned to hostpanel-demo (-p), so containers,
# volumes, broker, redis and the database are the demo's own and prod data is never touched.
# Manual, like production. Images are built here from the checkout and tagged :demo, so prod's
# :latest is never overwritten.
#
# CI/CD variables (scope demo/hostpanel). The job's environment wins over docker/.env on the host,
# so the demo's own values never leak into, or from, production's .env:
#   DEMO_ENABLED, DEMO_RESET_INTERVAL_HOURS, DEMO_ADMIN_EMAIL, DEMO_ADMIN_PASSWORD (required),
#   DEMO_CLIENT_EMAIL, DEMO_CLIENT_PASSWORD (required), DEMO_SMTP_PORT, DEMO_REDIS_PORT,
#   DEMO_API_HOST_PORT, DEMO_CLIENT_HOST_PORT, DEMO_ADMIN_HOST_PORT, DEMO_MAILHOG_UI_HOST_PORT,
#   DEMO_ADMIN_BASE_URL and DEMO_CLIENT_BASE_URL (both required: the bases of the links the demo mail carries),
# plus the demo's own DOMAIN, ADMIN_DOMAIN, ALLOWED_HOSTS and POSTGRES_DB, with AUTH_MODE=local.
deploy:demo:
  extends: .deploy-staging
  tags: [prod]
  variables:
    # The demo has a checkout of its own: this job runs `git checkout -f`, which in production's directory
    # would swap the files under the running production stack.
    DEPLOY_DIR: /home/innovayse-server/www/hostpanel-demo
    COMPOSE_FILES: -f docker/docker-compose.shared.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.platform.yml -f docker/docker-compose.demo.yml
    IMAGE_TAG: demo
    # Demo behaviour comes from Demo__Enabled, not from the environment name.
    ASPNETCORE_ENVIRONMENT: Production
  script:
    - test -d "$DEPLOY_DIR/.git" || git init "$DEPLOY_DIR"
    - git -C "$DEPLOY_DIR" fetch "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    - cd "$DEPLOY_DIR"
    - docker compose -p hostpanel-demo $COMPOSE_FILES pull --ignore-buildable
    - docker compose -p hostpanel-demo $COMPOSE_FILES build hostpanel-demo-api hostpanel-demo-client hostpanel-demo-admin
    # Services named one by one: nginx is parked, and the demo's broker, redis and mailhog come with the api.
    - docker compose -p hostpanel-demo $COMPOSE_FILES up -d hostpanel-db hostpanel-demo-api hostpanel-demo-client hostpanel-demo-admin
  environment: { name: demo/hostpanel }
  when: manual
  allow_failure: true
  needs: []
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "ci-test"

# ── Docker Hub (public images for self-hosters) ───────────────────────────────
# Runs only on a version tag (vMAJOR.MINOR.PATCH) and only when somebody plays it. Builds the
# prod target of the three Dockerfiles for linux/amd64 + linux/arm64 and pushes
# $DOCKERHUB_NAMESPACE/hostpanel:{api,client,admin}-<version without the v> and :{api,client,admin}-latest.
#
# Runner: multi-arch needs buildx plus QEMU emulation (a privileged binfmt install), and this
# project has no runner that can build outside the `builder` one. The job therefore carries the
# `builder` tag; if that runner is not privileged / has no Docker socket, the job stays pending
# until such a runner is registered, exactly like the build:* jobs above.
#
# CI/CD variables (Settings > CI/CD > Variables; nothing is stored in this file):
#   DOCKERHUB_NAMESPACE  Docker Hub user or organisation   (plain, protected)
#   DOCKERHUB_USERNAME   Docker Hub login                  (plain, protected)
#   DOCKERHUB_TOKEN      Docker Hub access token, write    (masked, protected)
# Protected variables are exposed only on protected refs, so `v*` must be a protected tag.
#
# Images are public, so they are built with AUTH_MODE=local: Innovayse.Auth lives in a private
# registry and no credential is passed. Both frontends take every deployment value from the environment at start (ADMIN_BASE_URL_PATH for the admin base path), so the image carries no build args.
# NOTE: the GitHub workflow .github/workflows/publish-dockerhub.yml is the primary publisher of
# these images. This job is a manual fallback only; do not run it for a tag GitHub already published.
publish:dockerhub:
  stage: build
  tags: [builder]
  image: docker:27
  needs: []
  variables:
    GIT_DEPTH: "1"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
    - docker buildx create --name hub --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      set -eu
      : "${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE must be set}"
      VERSION="${CI_COMMIT_TAG#v}"
      # The licence label is read from LICENSE, not typed in here, so it cannot drift from it.
      if grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE; then LICENSES="AGPL-3.0-or-later"; else echo "ERROR: LICENSE is not the AGPL text, set the SPDX id for it"; exit 1; fi
      # name | Dockerfile | context | extra build args
      for entry in         "api|backend/Dockerfile|backend|--build-arg AUTH_MODE=local"         "client|client/Dockerfile|client|"         "admin|admin/Dockerfile|.|"; do
        name="${entry%%|*}"; rest="${entry#*|}"
        dockerfile="${rest%%|*}"; rest="${rest#*|}"
        context="${rest%%|*}"; args="${rest#*|}"
        image="$DOCKERHUB_NAMESPACE/hostpanel"
        # $args is intentionally unquoted: it holds zero or more --build-arg words.
        docker buildx build --platform linux/amd64,linux/arm64 --target prod           -f "$dockerfile" $args           --label "org.opencontainers.image.source=https://github.com/innovayse/hostpanel"           --label "org.opencontainers.image.version=$VERSION"           --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"           --label "org.opencontainers.image.licenses=$LICENSES"           --label "org.opencontainers.image.title=hostpanel-$name"           -t "$image:$name-$VERSION" -t "$image:$name-latest" --push "$context"
      done
  after_script:
    - docker logout || true
  when: manual
  allow_failure: false
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ── production ───────────────────────────────────────────────────────────────
# ProdServer (10.0.0.4) serves host.innovayse.com. Unlike staging it does not
# consume registry images at all: inspecting the api container reports a bare
# `hostpanel-api` image, because this host builds its own from the checkout. So
# this job needs nothing from the build stage and declares `needs: []` — the
# build jobs require a `builder` runner, which this project does not have, and
# waiting on them would leave the deploy permanently pending.
#
# The three -f files (docker/) are the exact set the running containers were created with.
# Composing with fewer would silently redefine the project. To read either fact
# off a running host, find the container by its Compose labels rather than by
# name — the name carries the project, which is just the deploy directory:
#
#   docker inspect $(docker ps -q #     -f label=com.docker.compose.project=hostpanel #     -f label=com.docker.compose.service=api) #     --format '{{.Config.Image}} {{index .Config.Labels "com.docker.compose.project.config_files"}}'
deploy:prod:
  stage: deploy
  tags: [prod]
  variables:
    GIT_STRATEGY: none
    DEPLOY_DIR: /home/innovayse-server/www/innovayse-workspace/hostpanel
    COMPOSE_FILES: -f docker/docker-compose.shared.yml -f docker/docker-compose.prod.yml -f docker/docker-compose.platform.yml
    # The tag backend:build:*:prod / client:build:prod / admin:build:prod pushed from main.
    IMAGE_TAG: latest
    # See the note on deploy:staging above.
    ASPNETCORE_ENVIRONMENT: Production
    # This job builds the API image on the production host, so the Innovayse.Auth
    # credential has to reach the restore here too — docker-compose.prod.yml passes it
    # through as a build arg under this name. ProdServer's .env does not carry it, and
    # without it the restore goes to the feed anonymously and the build fails 401.
    NUGET_INNOVAYSE_CREDENTIALS: "Username=gitlab-ci-token;Password=${CI_JOB_TOKEN}"
  script:
    - git -C "$DEPLOY_DIR" fetch "$CI_REPOSITORY_URL" "$CI_COMMIT_SHA"
    - git -C "$DEPLOY_DIR" checkout -f "$CI_COMMIT_SHA"
    - cd "$DEPLOY_DIR"
    # Dump the database before anything is rebuilt. The API applies pending EF
    # migrations on startup, so `up -d` is the moment the schema and sometimes the
    # data change — and until now the only copy of what they looked like beforehand
    # was whatever the host happened to have. The database is around 11 MB; the dump
    # costs a second and a few megabytes, and the last ten are kept.
    #
    # Failing the deploy when the dump fails is the point. A deploy that cannot be
    # undone should not start.
    - mkdir -p "$DEPLOY_DIR/backups"
    - >
      docker exec hostpanel-db sh -lc
      'pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB}" -Fc'
      > "$DEPLOY_DIR/backups/hostpanel-$(date -u +%Y%m%dT%H%M%SZ)-${CI_COMMIT_SHORT_SHA}.dump"
    - ls -1t "$DEPLOY_DIR"/backups/hostpanel-*.dump | tail -n +11 | xargs -r rm --
    - ls -lh "$DEPLOY_DIR"/backups/ | tail -3
    # The service keys, not the old ones. They were renamed to carry the product
    # prefix when container_name was introduced — `api` and `client` no longer exist
    # in any compose file here, so this job could only fail with "no such service".
    #
    # admin is included now as well. It was left out, so ProdServer kept serving the
    # admin panel from whatever image was built the last time someone ran compose by
    # hand, and a deploy could not replace that container at all.
    - docker compose $COMPOSE_FILES build hostpanel-api hostpanel-client hostpanel-admin
    - docker compose $COMPOSE_FILES up -d hostpanel-api hostpanel-client hostpanel-admin
    # `up -d` above does not necessarily put a rebuilt image into service. Compose
    # decides whether to recreate by comparing the service's *configuration*, and every
    # built service here is `build:`-only with no `image:` key -- so the tag compose
    # derives (hostpanel-<service>:latest) is byte-identical from one deploy to the
    # next no matter what was built into it. On 2026-09-09 that left the frontends on
    # their pre-build images through a deploy that reported success; it was harmless
    # only because that commit happened to change no frontend code. `build` was added
    # to this job for the same class of bug one step earlier -- this is the other half.
    #
    # Not a blanket --force-recreate: that would restart containers on every deploy
    # even when nothing changed. Compare the image the container was created from
    # against the one its tag points at now, and recreate only where they differ.
    - |
      for svc in hostpanel-api hostpanel-client hostpanel-admin; do
        cid=$(docker compose $COMPOSE_FILES ps -q "$svc")
        if [ -z "$cid" ]; then echo "ERROR: $svc is not running after up -d"; exit 1; fi
        tag=$(docker inspect "$cid" --format '{{.Config.Image}}')
        want=$(docker image inspect "$tag" --format '{{.Id}}')
        have=$(docker inspect "$cid" --format '{{.Image}}')
        if [ "$have" != "$want" ]; then
          echo "$svc runs ${have#sha256:} but its image is now ${want#sha256:} - recreating."
          docker compose $COMPOSE_FILES up -d --force-recreate --no-deps "$svc"
          cid=$(docker compose $COMPOSE_FILES ps -q "$svc")
          have=$(docker inspect "$cid" --format '{{.Image}}')
          if [ "$have" != "$want" ]; then
            echo "ERROR: $svc is still on ${have#sha256:} after --force-recreate"
            exit 1
          fi
        fi
        echo "$svc is on image ${have#sha256:}"
      done
  environment: { name: production/hostpanel, url: "https://host.innovayse.com", deployment_tier: production }
  # Manual on purpose — merging should not by itself change what customers see.
  when: manual
  allow_failure: false
  needs: []
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com" && $CI_COMMIT_BRANCH == "main"
