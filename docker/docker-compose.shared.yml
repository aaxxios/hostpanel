# Infrastructure shared by the dev and prod stacks. Volume names are pinned: a rename is an empty database.
name: hostpanel

volumes:
  pgdata:
    name: hostpanel_pgdata
  redisdata:
    name: hostpanel_redisdata

services:
  hostpanel-db:
    container_name: hostpanel-db
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  hostpanel-rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must be set}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Holds the session cookie key ring: losing it signs everyone out, so it is persisted.
  hostpanel-redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set}
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
