# Response headers every public answer of the stack carries. Included by name in every location of the
# edge and of the admin image: a location that sets any add_header of its own drops the ones inherited
# from the server block, so the headers cannot live at server level.
#
# HSTS is ignored by a browser on a plain-HTTP origin, so it is harmless in the mode that serves
# HTTP behind another TLS proxy and in force everywhere TLS ends.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# A stored or proxied file is never reinterpreted as another type.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The panel pages are never framed. The Content-Security-Policy frame-ancestors of the pages that carry
# one says the same for current browsers; this header covers the rest.
add_header X-Frame-Options "DENY" always;
# Nothing here uses the camera, the microphone, the location or USB devices.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
