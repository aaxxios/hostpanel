# Operator-uploaded branding: the logo, the favicon and the icon set generated from them. Included in
# BOTH server blocks on purpose. The setting rows store root-relative URLs so a domain change never
# strands them, which only holds if the same path means the same file wherever it is read: the
# storefront renders it, and the admin panel previews it straight after the upload.
location /uploads/ {
    proxy_pass         http://api_backend/uploads/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;

    # These are files an admin uploaded. They are re-encoded to PNG by the API before they are ever
    # written, but nosniff (in the shared headers) is the second lock: it stops a browser deciding for
    # itself that a stored file is something executable. The policy below is the third: a file opened
    # on its own may load nothing and run nothing.
    include snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}
